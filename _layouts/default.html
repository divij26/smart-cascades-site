<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
  :root { --green: #037f4c; --ink: #1f2a2e; --muted: #5b6b70; --line: #e3e8ea; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 24px 48px; }
  h1 { font-size: 30px; line-height: 1.2; }
  h2 { margin-top: 32px; }
  a { color: var(--green); }
  footer { max-width: 760px; margin: 0 auto; padding: 16px 24px 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer a { margin-right: 16px; }
</style>
</head>
<body>
<main>
{{ content }}
</main>
<footer>
  <a href="{{ '/' | relative_url }}">Support</a>
  <a href="{{ '/how-to-use.html' | relative_url }}">How to use</a>
  <a href="{{ '/privacy' | relative_url }}">Privacy</a>
  <a href="{{ '/terms' | relative_url }}">Terms</a>
</footer>
</body>
</html>
