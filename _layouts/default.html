<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root { --green: #037f4c; --green-dark: #02653d; --ink: #1f2a2e; --muted: #5b6b70; --line: #e3e8ea; --tint: #e6f4ee; --bg: #f4f7f8; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }

  header.top { background: #fff; border-bottom: 1px solid var(--line); }
  header.top .bar { max-width: 960px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--ink); text-decoration: none; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--green); position: relative; flex: none; }
  .logo::before, .logo::after { content: ""; position: absolute; left: 7px; right: 7px; height: 3px; border-radius: 2px; background: #fff; }
  .logo::before { top: 9px; }
  .logo::after { top: 16px; right: 12px; }
  nav a { color: var(--muted); text-decoration: none; margin-left: 20px; font-size: 15px; font-weight: 500; }
  nav a:hover, nav a[aria-current="page"] { color: var(--green); }

  .hero { background: linear-gradient(135deg, #037f4c 0%, #025c38 100%); color: #fff; }
  .hero .inner { max-width: 960px; margin: 0 auto; padding: 44px 24px 40px; }
  .hero h1 { margin: 0; font-size: 34px; line-height: 1.2; letter-spacing: -0.01em; }
  .hero p { margin: 10px 0 0; font-size: 18px; color: #d4efe3; max-width: 640px; }

  main { max-width: 960px; margin: -22px auto 0; padding: 0 24px 48px; position: relative; }
  article { background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 10px rgba(20, 40, 50, 0.05); padding: 32px 36px 40px; max-width: 800px; }
  article > h1:first-child { display: none; }
  article h2 { font-size: 22px; line-height: 1.3; margin: 36px 0 12px; padding-top: 24px; border-top: 1px solid var(--line); }
  article h2:first-of-type { margin-top: 8px; padding-top: 0; border-top: 0; }
  article h3 { font-size: 17px; margin: 24px 0 8px; }
  article p, article li { max-width: 68ch; }
  article ol, article ul { padding-left: 24px; }
  article li { margin: 6px 0; }
  article a { color: var(--green); text-underline-offset: 2px; }
  article a:hover { color: var(--green-dark); }
  article code { background: #f2f4f5; padding: 1px 6px; border-radius: 4px; font-size: 14px; }
  article table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 15px; display: block; overflow-x: auto; }
  article th, article td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  article th { background: #f6f8f9; }
  article em { color: var(--muted); }
  article blockquote { margin: 16px 0; padding: 10px 16px; background: var(--tint); border-left: 4px solid var(--green); border-radius: 6px; }

  footer.bottom { max-width: 960px; margin: 0 auto; padding: 8px 24px 48px; color: var(--muted); font-size: 14px; }
  footer.bottom a { color: var(--muted); margin-right: 18px; text-decoration: none; }
  footer.bottom a:hover { color: var(--green); }

  @media (max-width: 600px) {
    .hero h1 { font-size: 26px; }
    .hero p { font-size: 16px; }
    article { padding: 22px 18px 30px; border-radius: 10px; }
    nav a { margin: 0 14px 0 0; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="logo" aria-hidden="true"></span>Smart Dependent Dropdowns</a>
    <nav aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Support</a>
      <a href="{{ '/how-to-use.html' | relative_url }}">How to use</a>
      <a href="{{ '/privacy' | relative_url }}"{% if page.url contains 'privacy' %} aria-current="page"{% endif %}>Privacy</a>
      <a href="{{ '/terms' | relative_url }}"{% if page.url contains 'terms' %} aria-current="page"{% endif %}>Terms</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="inner">
    <h1>{{ page.hero_title | default: page.title }}</h1>
    {% if page.hero_text %}<p>{{ page.hero_text }}</p>{% endif %}
  </div>
</section>

<main>
  <article>
{{ content }}
  </article>
</main>

<footer class="bottom">
  <a href="mailto:support@zedmere.com">support@zedmere.com</a>
  <a href="{{ '/privacy' | relative_url }}">Privacy</a>
  <a href="{{ '/terms' | relative_url }}">Terms</a>
</footer>
</body>
</html>
